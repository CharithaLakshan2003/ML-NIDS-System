# ML Engine without local Kafka - connects to external Kafka
name: nids-ml-engine-ext

services:
  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: ml-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
      KAFKA_BOOTSTRAP: 
    volumes:
      - ./flink_jobs:/opt/flink/usrlib/flink_jobs
      - ./models:/opt/flink/usrlib/models
      - flink-checkpoints:/opt/flink/checkpoints

  taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: ml-flink-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
      KAFKA_BOOTSTRAP: 
    volumes:
      - ./flink_jobs:/opt/flink/usrlib/flink_jobs
      - ./models:/opt/flink/usrlib/models
      - flink-checkpoints:/opt/flink/checkpoints

volumes:
  flink-checkpoints:
