# ---------------------------------------------------------------------------
# Hybrid NIDS - KAFKA PROCESS
#
# Kafka + Kafka-UI + MinIO + OpenSearch + datalake-writer + alert-indexer + backend
# ---------------------------------------------------------------------------

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: nids-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "hybrid-nids-kraft-cluster-1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nids-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hybrid-nids
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  minio:
    image: minio/minio:latest
    container_name: nids-minio
    ports:
      - "9500:9000"
      - "9501:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: nids-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/nids-datalake &&
      echo 'Bucket nids-datalake ready.'
      "

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: nids-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "NidsDev#2026!"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9400:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 15

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: nids-opensearch-dashboards
    depends_on:
      - opensearch
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"

  datalake-writer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nids-datalake-writer
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_ENGINEERED_FEATURES: engineered-features
      KAFKA_CONSUMER_GROUP_DATALAKE: nids-datalake-writer
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: nids-datalake
      PARQUET_BATCH_MAX_ROWS: 10000
      PARQUET_BATCH_TIMEOUT_SEC: 10
      S3_FORCE_PATH_STYLE: "true"
    restart: unless-stopped

  alert-indexer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nids-alert-indexer
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_NIDS_ALERTS: nids-alerts
      KAFKA_CONSUMER_GROUP_ALERTS: nids-alert-indexer
      OPENSEARCH_HOSTS: http://opensearch:9200
      OPENSEARCH_INDEX_ALERTS_PREFIX: nids-alerts
      OPENSEARCH_RETRY_MAX: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nids-backend
    depends_on:
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      OPENSEARCH_HOSTS: http://opensearch:9200
      OPENSEARCH_INDEX_ALERTS_PREFIX: nids-alerts
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: nids-datalake
      S3_FORCE_PATH_STYLE: "true"
    restart: unless-stopped

volumes:
  minio-data:
  opensearch-data:
